<div class="login-container">

  <!-- LADO ESQUERDO - LOGIN -->
  <div class="login-area">

    <div class="login-card">

      <img src="/img/logo.jpg" class="ford-logo" alt="Logo Ford">

      <h1>Boas-vindas</h1>
      <p>Entre para continuar</p>

     <form (ngSubmit)="login()">

<input type="text" [(ngModel)]="usuario.nome" name="nome">

<br>

<input type="password" [(ngModel)]="usuario.senha" name="senha">

<button type="submit">Entrar</button>

</form>
</div>

    </div>

  </div>


  <!-- LADO DIREITO -->
  <div class="car-area">

    <div class="car-text">

      <h2>
        FORÇA QUE<br>
        <span>MOVE VOCÊ</span>
      </h2>

      <p>
        Desempenho extremo para<br>
        qualquer desafio.
      </p>

    </div>

  </div>

</div>
