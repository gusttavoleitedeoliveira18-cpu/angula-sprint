<div class="login-container">
  
  <!-- Lado Esquerdo: Formulário -->
  <div class="login-card">
    <div class="form-wrapper">
      
      <!-- Logo da Ford -->
      <div class="logo-area">
        <img 
          src="https://upload.wikimedia.org/wikipedia/commons/a/a0/Ford_Motor_Company_Logo.svg" 
          alt="Ford Logo"
        />
      </div>

      <!-- Títulos -->
      <h1 class="title">Boas-vindas</h1>
      <p class="subtitle">Entre para continuar</p>

      <!-- Mensagem de Alerta (se houver erro) -->
      <div *ngIf="mensagemErro" class="error-alert">
        {{ mensagemErro }}
      </div>

      <!-- Formulário -->
      <form (ngSubmit)="fazerLogin()">
        
        <div class="input-group">
          <label for="usuario">Usuário</label>
          <input 
            id="usuario"
            type="text" 
            [(ngModel)]="usuario" 
            name="usuario" 
            placeholder="Digite seu usuário" 
          />
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input 
            id="senha"
            type="password" 
            [(ngModel)]="senha" 
            name="senha" 
            placeholder="Digite sua senha" 
          />
        </div>

        <button type="submit" [disabled]="carregando" class="btn-entrar">
          {{ carregando ? 'Entrando...' : 'Entrar' }}
        </button>

      </form>

    </div>
  </div>

  <!-- Lado Direito: Banner Promocional -->
  <div class="banner-card">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <h2>FORÇA QUE<br><span>MOVE VOCÊ</span></h2>
      <p>Desempenho extremo para qualquer desafio.</p>
    </div>
  </div>

</div>
